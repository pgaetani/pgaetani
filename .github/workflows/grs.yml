name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: stats
            card: stats
            options: username=${{ github.repository_owner }}&show_icons=true&theme=catppuccin_mocha
          - name: top-langs
            card: top-langs
            options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=320&theme=catppuccin_mocha

    steps:
      - name: Generate ${{ matrix.name }} card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: ${{ matrix.card }}
          options: ${{ matrix.options }}
          path: profile/${{ matrix.name }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: card-${{ matrix.name }}
          path: profile/${{ matrix.name }}.svg

  commit:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          pattern: card-*
          path: profile
          merge-multiple: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
